anatomy: !!omap
- actions:
  - Flexes the knee
  - Extends the hip (long head)
  - Laterally rotates the leg when the knee is flexed
- insertions:
  - '<strong>Long head</strong>: Merges into the common hamstring tendon on the head of the {{ link("fibula")
    }} with slips to the lateral condyle of the {{ link("tibia") }}'
  - '<strong>Short head</strong>: Joins the long head in the shared tendon on the head of the {{ link("fibula")
    }} and fans into the fascia at the lateral condyle of the {{ link("tibia") }}'
- origins:
  - '<strong>Long head</strong>: Ischial tuberosity of the {{ link("pelvis") }}'
  - '<strong>Short head</strong>: Linea aspera of the {{ link("femur") }}'
description: 'Two-headed lateral hamstring whose long head springs from the pelvis
  while the short head arises on the distal femur to reinforce knee flexion and hip
  extension power.

  '
