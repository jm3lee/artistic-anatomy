  - Proximal medial surface of the {{ link('tibia') }} (pes anserinus)
- origins:
  - Ischial tuberosity of the {{ link('pelvis') }}
description: Cordlike medial hamstring that blends into the pes anserinus after a
  long, narrow tendon.
