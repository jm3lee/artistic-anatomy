anatomy:
  bony_landmarks:
  - desc: 'Large lateral projection of the proximal femur; attachment site for {{
      linktitle(''gluteus-medius'') }}, {{ linktitle(''gmin'') }}, {{ linktitle(''piriformis'')
      }}, {{ linktitle(''obturator-internus'') }}, {{ linktitle(''obturator-externus'')
      }}, {{ linktitle(''superior-gemellus'') }}, and {{ linktitle(''inferior-gemellus'')
      }}.

      '
    name: Greater trochanter {{ anchor("greater-trochanter") }}
  - desc: 'Posteromedial conical eminence below the neck; insertion point for {{ linktitle(''iliopsoas'')
      }} (psoas major and iliacus).

      '
    name: Lesser trochanter {{ anchor("lesser-trochanter") }}
  - desc: 'Ridge connecting greater and lesser trochanters on the posterior femur;
      the quadrate tubercle on this crest is where {{ linktitle(''quadratus-femoris'')
      }} inserts.

      '
    name: Intertrochanteric crest {{ anchor("intertrochanteric-crest") }}
  - desc: 'Roughened area on the posterior shaft just distal to the greater trochanter;
      insertion site for {{ linktitle(''gluteus-maximus'') }}.

      '
    name: Gluteal tuberosity {{ anchor("gluteal-tuberosity") }}
  - desc: 'Oblique ridge running from the lesser trochanter toward the {{ linktitle(''linea-aspera'')
      }}; attachment site for {{ linktitle(''pectineus'') }}.

      '
    name: Pectineal line {{ anchor("pectineal-line") }}
  - desc: 'Vertical ridge on the posterior shaft with medial and lateral lips; attachments
      for {{ linktitle(''adductor-brevis'') }}, {{ linktitle(''adductor-longus'')
      }}, the adductor part of {{ linktitle(''adductor-magnus'') }}, and origins of
      {{ linktitle(''vastus-lateralis'') }} and {{ linktitle(''vastus-medialis'')
      }}.

      '
    name: Linea aspera {{ anchor("linea-aspera") }}
  - desc: 'Small elevation on the medial epicondyle; insertion site for the hamstring
      part of {{ linktitle(''adductor-magnus'') }}.

      '
    name: Adductor tubercle {{ anchor("adductor-tubercle") }}
  - desc: 'Distal medial articular prominence; origin site for {{ linktitle(''gastrocnemius-medial-head'')
      }}.

      '
    name: Medial condyle {{ anchor("medial-condyle") }}
  - desc: 'Distal lateral articular prominence; origin site for {{ linktitle(''gastrocnemius-lateral-head'')
      }}, {{ linktitle(''popliteus'') }}, and {{ linktitle(''plantaris'') }}.

      '
    name: Lateral condyle {{ anchor("lateral-condyle") }}
  insertions:
  - muscles:
    - '{{ linktitle("gluteus-medius") }}'
    - '{{ linktitle("gmin") }}'
    - '{{ linktitle("piriformis") }}'
    - '{{ linktitle("obturator-internus") }}'
    - '{{ linktitle("obturator-externus") }}'
    - '{{ linktitle("superior-gemellus") }}'
    - '{{ linktitle("inferior-gemellus") }}'
    name: Greater trochanter
  - muscles:
    - '{{ linktitle("gluteus-maximus") }}'
    name: Gluteal tuberosity
  - muscles:
    - '{{ linktitle("iliopsoas") }}'
    name: Lesser trochanter
  - muscles:
    - '{{ linktitle("quadratus-femoris") }}'
    name: Intertrochanteric crest
  - muscles:
    - '{{ linktitle("pectineus") }}'
    name: Pectineal line
  - muscles:
    - '{{ linktitle("adductor-brevis") }}'
    - '{{ linktitle("adductor-longus") }}'
    - '{{ linktitle("adductor-magnus") }}'
    - '{{ linktitle("biceps-femoris-short-head") }}'
    name: Linea aspera
  - muscles:
    - '{{ linktitle("adductor-magnus") }}'
    name: Adductor tubercle
  origins:
  - muscles:
    - '{{ linktitle("vastus-lateralis") }}'
    name: Greater trochanter and lateral linea aspera
  - muscles:
    - '{{ linktitle("vastus-medialis") }}'
    name: Intertrochanteric line and medial linea aspera
  - muscles:
    - '{{ linktitle("vastus-intermedius") }}'
    name: Anterior and lateral shaft of femur
  - muscles:
    - '{{ linktitle("biceps-femoris-short-head") }}'
    name: Linea aspera (lateral lip)
  - muscles:
    - '{{ linktitle("gastrocnemius-medial-head") }}'
    name: Medial condyle of femur
  - muscles:
    - '{{ linktitle("gastrocnemius-lateral-head") }}'
    - '{{ linktitle("popliteus") }}'
    - '{{ linktitle("plantaris") }} (origin just above lateral condyle)'
    name: Lateral condyle of femur
description: 'The femur is the thigh bone and the body''s longest, strongest bone
  connecting the hip and knee joints.

  '
