anatomy:
  bony_landmarks:
  - desc: 'Prominent ridge on the {{ link("posterior") }} surface separating the
      supraspinous and infraspinous fossae and ending laterally at the acromion.

      '
    name: Spine {{"{#spine}"}}
  - desc: 'Flat projection at the {{ link("lateral") }} end of the spine that articulates
      with the {{ linkicon("clavicle") }}.

      '
    name: Acromion process {{"{#acromion-process}"}}
  - desc: 'Hook-like {{ link("anterior") }} projection providing attachments for
      {{ linkicon("pecmin") }}, coracobrachialis, and the short head of {{ linktitle("bc")
      }}.

      '
    name: Coracoid process {{"{#coracoid-process}"}}
  - desc: 'Shallow socket that receives the head of the {{ linkicon("humerus") }}
      to form the glenohumeral joint.

      '
    name: Glenoid cavity {{"{#glenoid-cavity}"}}
  - desc: 'Smooth concavity above the spine housing the supraspinatus.

      '
    name: Supraspinous fossa {{"{#supraspinous-fossa}"}}
  - desc: 'Broad surface below the spine that lodges the infraspinatus.

      '
    name: Infraspinous fossa {{"{#infraspinous-fossa}"}}
  - desc: 'Wide {{ link("anterior") }} depression serving as attachment for the
      subscapularis.

      '
    name: Subscapular fossa {{"{#subscapular-fossa}"}}
  - desc: 'Long edge nearest the spine; attachment for rhomboids and part of the serratus
      anterior.

      '
    name: Medial border {{"{#medial-border}"}}
  - desc: 'Edge closest to the axilla providing attachment for teres major and teres
      minor.

      '
    name: Lateral border {{"{#lateral-border}"}}
  - desc: 'Shortest border near the neck containing the suprascapular notch for passage
      of the suprascapular nerve.

      '
    name: Superior border {{"{#superior-border}"}}
  - desc: 'Lower tip where medial and lateral borders meet; attachment for teres major.

      '
    name: Inferior angle {{"{#inferior-angle}"}}
  - desc: 'Upper tip joining the superior and medial borders; attachment for part
      of the levator scapulae.

      '
    name: Superior angle {{"{#superior-angle}"}}
  - desc: 'Small notch on the {{ link("superior") }} border transmitting the suprascapular
      nerve beneath the superior transverse ligament.

      '
    name: Suprascapular notch {{"{#suprascapular-notch}"}}
author: Brian Lee
description: 'The scapula is a triangular shoulder blade that glides on the rib cage
  to position the arm and offers many muscle attachment sites.

  '
icon: ':bone:'
id: scapula
pubdate: Aug 28, 2025
status: Pending Review
title: Scapula
