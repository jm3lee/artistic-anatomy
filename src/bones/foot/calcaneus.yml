anatomy:
  bony_landmarks:
  - desc: 'Posterior projection forming the heel; insertion for the Achilles tendon
      from {{ linktitle(''gastrocnemius'') }}, {{ linktitle(''soleus'') }}, and {{
      linktitle(''plantaris'') }}.

      '
    name: Calcaneal tuberosity {{ anchor("calcaneal-tuberosity") }}
  - desc: 'Medial shelf supporting the talus and creating a groove for flexor hallucis
      longus.

      '
    name: Sustentaculum tali {{ anchor("sustentaculum-tali") }}
  - desc: 'Lateral projection separating the tendons of fibularis longus and brevis.

      '
    name: Peroneal tubercle {{ anchor("peroneal-tubercle") }}
  insertions:
  - muscles:
    - '{{ linktitle("gastrocnemius") }}'
    - '{{ linktitle("soleus") }}'
    - '{{ linktitle("plantaris") }}'
    name: Calcaneal tuberosity
  origins:
  - muscles:
    - Abductor hallucis
    - Flexor digitorum brevis
    - Quadratus plantae (medial head)
    name: Medial process of calcaneal tuberosity
  - muscles:
    - Abductor digiti minimi
    - Quadratus plantae (lateral head)
    name: Lateral process of calcaneal tuberosity
  - muscles:
    - Extensor digitorum brevis
    - Extensor hallucis brevis
    name: Superolateral surface
