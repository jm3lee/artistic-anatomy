anatomy:
  bony_landmarks:
  - name: 'Calcaneal tuberosity {{"{#calcaneal-tuberosity}"}}'
    desc: >
      Posterior projection forming the heel; insertion for the
      Achilles tendon from {{ linktitle('gastrocnemius') }},
      {{ linktitle('soleus') }}, and {{ linktitle('plantaris') }}.
  - name: 'Sustentaculum tali {{"{#sustentaculum-tali}"}}'
    desc: >
      Medial shelf supporting the talus and creating a groove for
      flexor hallucis longus.
  - name: 'Peroneal tubercle {{"{#peroneal-tubercle}"}}'
    desc: >
      Lateral projection separating the tendons of fibularis longus
      and brevis.
  insertions:
  - name: Calcaneal tuberosity
    muscles:
    - '{{ linktitle("gastrocnemius") }}'
    - '{{ linktitle("soleus") }}'
    - '{{ linktitle("plantaris") }}'
  origins:
  - name: Medial process of calcaneal tuberosity
    muscles:
    - Abductor hallucis
    - Flexor digitorum brevis
    - Quadratus plantae (medial head)
  - name: Lateral process of calcaneal tuberosity
    muscles:
    - Abductor digiti minimi
    - Quadratus plantae (lateral head)
  - name: Superolateral surface
    muscles:
    - Extensor digitorum brevis
    - Extensor hallucis brevis
author: Brian Lee
description: >
  The calcaneus forms the heel and transmits weight from the leg to
  the foot while providing leverage for the plantar flexors.
icon: ':bone:'
id: calcaneus
pubdate: Aug 29, 2025
status: Review Pending
