anatomy:
  bony_landmarks:
  - desc: 'Disc-shaped proximal epiphysis that articulates with the humerus and ulna.

      '
    name: Head {{ anchor("head") }}
  - desc: 'Narrow region just distal to the head and a common fracture site.

      '
    name: Neck {{ anchor("neck") }}
  - desc: 'Rough anterior projection where {{ linkicon(''bc'') }} inserts.

      '
    name: Radial tuberosity {{ anchor("radial-tuberosity") }}
  - desc: 'Sharp {{ link(''medial'') }} edge along the shaft for interosseous membrane
      attachment.

      '
    name: Interosseous border {{ anchor("interosseous-border") }}
  - desc: 'Distal {{ link(''medial'') }} concavity articulating with the head of the
      {{ linkicon(''ulna'') }}.

      '
    name: Ulnar notch {{ anchor("ulnar-notch") }}
  - desc: 'Posterior distal bump, also called Lister''s tubercle, guiding extensor
      pollicis longus.

      '
    name: Dorsal tubercle {{ anchor("dorsal-tubercle") }}
  - desc: 'Pointed distal projection anchoring the radial collateral ligament and
      {{ linkicon(''brr'') }}.

      '
    name: Styloid process {{ anchor("styloid-process") }}
  insertions:
  - muscles:
    - '{{ linktitle("bc") }}'
    name: Radial tuberosity and bicipital aponeurosis
  - muscles:
    - '{{ linktitle("protrs") }}'
    name: Lateral surface (midshaft)
  - muscles:
    - '{{ linktitle("supinator") }}'
    name: Proximal lateral radius
  - muscles:
    - '{{ linktitle("brr") }}'
    name: Styloid process of radius
description: 'The radius is the lateral forearm bone that pivots around the ulna to
  enable pronation and supination.

  '
