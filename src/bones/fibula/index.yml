author: Brian Lee
icon: ':bone:'
id: fibula
pubdate: Aug 25, 2025
status: Review Pending
title: Fibula
breadcrumbs:
  - title: Home
    url: /
  - title: Bones
    url: /bones/
  - title: Fibula
url: /bones/fibula/
description: >
  The fibula is a slender lateral leg bone running parallel to the tibia and
  forming the outer ankle while serving as an anchor for muscles.
anatomy:
  bony_landmarks:
  - name: 'Head <a class="text-decoration-none text-muted" href="#head"><small>#</small></a>'
    desc: >
      Rounded proximal end articulating with the {{ linkicon('tibia') }}.
  - name: 'Neck <a class="text-decoration-none text-muted" href="#neck"><small>#</small></a>'
    desc: >
      Narrow region just distal to the head.
  - name: 'Shaft <a class="text-decoration-none text-muted" href="#shaft"><small>#</small></a>'
    desc: >
      Long, thin body of the bone.
  - name: 'Lateral malleolus <a class="text-decoration-none text-muted" href="#lateral-malleolus"><small>#</small></a>'
    desc: >
      Distal projection forming the outer ankle and attachment point for the
      fibular collateral ligament.
  origins:
  - name: 'Proximal lateral fibula'
    muscles:
    - '{{ linktitle("fibularis-longus") }}'
    - '{{ linktitle("fibularis-brevis") }}'
  - name: 'Posterior proximal fibula'
    muscles:
    - '{{ linktitle("soleus") }}'
  insertions:
  - name: Head of fibula
    muscles:
    - '{{ linktitle("bfem") }}'
