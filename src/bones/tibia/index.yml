anatomy:
  insertions:
  - muscles:
    - Rectus femoris
    - Vastus lateralis
    - Vastus medialis
    - Vastus intermedius
    name: Tibial Tuberosity (via patellar ligament)
  - muscles:
    - '{{ linktitle("sartorius") }}'
    - Gracilis
    - Semitendinosus
    name: Pes anserinus (anteromedial proximal tibia, distal to medial condyle)
  - muscles:
    - Semimembranosus
    name: Medial condyle / posterior medial tibia
  - muscles:
    - Popliteus
    name: Lateral condyle / posterior lateral tibia
  - muscles:
    - '{{ linktitle("tibialis-anterior") }} (distally on medial cuneiform & base of
      1st metatarsal)'
    name: Shaft (anteromedial surface, distal third)
  origins:
  - muscles:
    - '{{ linktitle("tibialis-anterior") }}'
    - '{{ linktitle("extensor-digitorum") }} (also from proximal fibula)'
    name: Lateral condyle & proximal lateral tibial shaft
  - muscles:
    - Soleus
    name: Soleal line (posterior proximal tibia)
  - muscles:
    - Flexor digitorum longus
    name: Posterior surface, inferior to soleal line (middle third)
  - muscles:
    - Tibialis posterior
    name: Posterior surface & interosseous membrane (distal two-thirds)
