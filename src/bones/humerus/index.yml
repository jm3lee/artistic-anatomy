anatomy:
  bony_landmarks:
  - desc: 'The rounded, proximal articular surface that fits into the glenoid cavity
      of the {{ linktitle("scapula") }}, forming the glenohumeral (shoulder) joint.

      '
    name: Head of the Humerus {{ anchor("head-of-humerus") }}
  - desc: 'The slight constriction immediately distal to the head, marking the site
      of the epiphyseal plate in development and serving as the attachment for the
      joint capsule.

      '
    name: Anatomical Neck {{ anchor("anatomical-neck") }}
  - desc: 'The narrower region distal to the tubercles; a common fracture site.

      '
    name: Surgical Neck {{ anchor("surgical-neck") }}
  - desc: 'A large, lateral projection just distal to the head that provides attachment
      for the {{ linktitle("supraspinatus") }}, {{ linktitle("infraspinatus") }},
      and {{ linktitle("teres-minor") }} muscles.

      '
    name: Greater Tubercle {{ anchor("greater-tubercle") }}
  - desc: 'A shallow groove running obliquely down the posterior shaft, transmitting
      the radial nerve and deep brachial artery.

      '
    name: Radial (Spiral) Groove {{ anchor("radial-spiral-groove") }}
  - desc: 'A small opening on the anteromedial shaft that allows nutrient vessels
      to enter the bone.

      '
    name: Nutrient (Oblique) Foramen {{ anchor("nutrient-foramen") }}
  - desc: 'A prominent projection on the distal medial side, providing origin for
      the common flexor tendon (flexor-pronator muscles) and attachment of the ulnar
      collateral ligament of the elbow.

      '
    name: Medial Epicondyle {{ anchor("medial-epicondyle") }}
  - desc: 'A smaller lateral projection that gives origin to the common extensor tendon
      (extensor-supinator muscles) and attachment for the radial collateral ligament.

      '
    name: Lateral Epicondyle {{ anchor("lateral-epicondyle") }}
  - desc: 'A rounded eminence on the anterior, distal lateral humerus that articulates
      with the head of the {{ linktitle("radius") }}.

      '
    name: Capitulum {{ anchor("capitulum") }}
  - desc: 'A spool-shaped medial projection on the anterior distal humerus that articulates
      with the trochlear notch of the {{ linktitle("ulna") }}.

      '
    name: Trochlea {{ anchor("trochlea") }}
  insertions:
  - muscles:
    - '{{ linktitle("infraspinatus") }}'
    - '{{ linktitle("supraspinatus") }}'
    - '{{ linktitle("teres-minor") }}'
    name: Greater Tubercle
  - muscles:
    - '{{ linktitle("subscp") }}'
    name: Lesser Tubercle
  - muscles:
    - '{{ linktitle("ld") }} – floor'
    - '{{ linktitle("pecmaj") }} – lateral lip'
    - '{{ linktitle("teres-major") }} – medial lip'
    name: Intertubercular (Bicipital) Groove and Crests
  - muscles:
    - '{{ linktitle("dt") }}'
    name: Deltoid Tuberosity
  - muscles:
    - '{{ linktitle("coracobrachialis") }}'
    name: Medial Shaft of Humerus
  origins:
  - muscles:
    - '{{ linktitle("protrs") }} (humeral head)'
    - '{{ linktitle("fcr") }}'
    - Palmaris longus
    - '{{ linktitle("fcu") }} (humeral head)'
    - Flexor digitorum superficialis (humeral head)
    name: Medial epicondyle (common flexor origin)
  - muscles:
    - Extensor carpi radialis brevis
    - '{{ linktitle("extensor-digitorum") }}'
    - Extensor digiti minimi
    - '{{ linktitle("extensor-carpi-ulnaris") }}'
    - Supinator
    name: Lateral epicondyle (common extensor origin)
  - muscles:
    - '{{ linktitle("brr") }}'
    - Extensor carpi radialis longus
    name: Lateral supracondylar ridge
  - muscles:
    - '{{ linktitle("brc") }}'
    name: Anterior shaft (distal half)
  - muscles:
    - '{{ linktitle("trc") }} (lateral and medial heads)'
    name: Posterior shaft (radial groove region)
  - muscles:
    - '{{ linktitle("trc") }} (long head)'
    name: Infraglenoid Tubercle
