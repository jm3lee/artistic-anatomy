anatomy:
  bony_landmarks:
  - desc: 'Anterior projection distal to the trochlear notch that helps form the elbow
      joint and provides attachment for the {{ linktitle(''brc'') }}.

      '
    name: Coronoid process {{"{#coronoid-process}"}}
  - desc: 'Distal rounded end articulating with the radius and the wrist''s fibrocartilage
      complex.

      '
    name: Head of ulna {{"{#head}"}}
  - desc: 'Sharp {{ link(''lateral'') }} ridge along the shaft where the interosseous
      membrane attaches, linking ulna to radius.

      '
    name: Interosseous border {{"{#interosseous-border}"}}
  - desc: 'Large {{ link(''posterior'') }} hook forming the elbow point; insertion
      site for {{ linktitle(''trc'') }} and attachment for {{ linktitle(''anc'') }}
      and {{ linktitle(''fcu'') }}.

      '
    name: Olecranon process {{"{#olecranon-process}"}}
  - desc: 'Shallow {{ link(''lateral'') }} depression receiving the head of the {{
      linkicon(''radius'') }} to form the proximal radioulnar joint.

      '
    name: Radial notch {{"{#radial-notch}"}}
  - desc: 'Pointed distal projection for the ulnar collateral {{ link(''ligament'')
      }} of the wrist.

      '
    name: Styloid process {{"{#styloid-process}"}}
  - desc: 'Ridge on the proximal {{ link(''lateral'') }} ulna providing origin for
      the supinator.

      '
    name: Supinator crest {{"{#supinator-crest}"}}
  - desc: 'C-shaped articular surface below the olecranon that grips the humeral trochlea.

      '
    name: Trochlear notch {{"{#trochlear-notch}"}}
  - desc: 'Rough area below the coronoid process on the {{ link(''anterior'') }} shaft
      where {{ linktitle(''brc'') }} and flexor digitorum profundus attach.

      '
    name: Ulnar tuberosity {{"{#ulnar-tuberosity}"}}
  insertions:
  - muscles:
    - '{{ linktitle("brc") }}'
    name: Coronoid process and ulnar tuberosity
  - muscles:
    - '{{ linktitle("anc") }}'
    name: Lateral olecranon
  - muscles:
    - '{{ linktitle("trc") }} (all heads)'
    name: Olecranon process
  - muscles:
    - '{{ linktitle("fcu") }} (via pisiform, hamate, 5th metacarpal)'
    name: Posterior border of ulna
  - muscles:
    - '{{ linktitle("flexor-digitorum-superficialis") }} (via intermediate phalanges;
      indirect insertion)

      '
    name: Ulnar shaft (anteromedial surface)
  - muscles:
    - '{{ linktitle("flexor-digitorum-profundus") }} (ulnar half)'
    name: Ulnar tuberosity (anteromedial shaft)
author: Brian Lee
