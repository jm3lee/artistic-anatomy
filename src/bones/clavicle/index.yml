anatomy:
  bony_landmarks:
  - desc: 'Medial end that articulates with the sternum.

      '
    name: Sternal end {{ anchor("sternal-end") }}
  - desc: 'Lateral end that articulates with the {{ linkicon(''scapula'') }} at the
      acromioclavicular joint.

      '
    name: Acromial end {{ anchor("acromial-end") }}
  - desc: 'The middle portion with a gentle S-curve.

      '
    name: Shaft {{ anchor("shaft") }}
  - desc: 'Rough area on the lateral third for attachment of the {{ linkicon(''dt'')
      }}.

      '
    name: Deltoid tubercle {{ anchor("deltoid-tubercle") }}
  insertions:
  - muscles:
    - '{{ linktitle("pecmaj") }}'
    - '{{ linktitle("scm") }}'
    name: Medial clavicle
  - muscles:
    - '{{ linktitle("dt") }}'
    - '{{ linktitle("trapezius") }}'
    name: Deltoid tubercle
description: The clavicle is a slender S-shaped bone connecting the sternum and scapula
  to brace the shoulder.
