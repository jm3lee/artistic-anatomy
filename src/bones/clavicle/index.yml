author: Brian Lee
icon: ':bone:'
id: clavicle
pubdate: Aug 25, 2025
status: Review Pending
title: Clavicle
breadcrumbs:
  - title: Home
    url: /
  - title: Bones
    url: /bones/
  - title: Clavicle
url: /bones/clavicle
description: >
  The clavicle is a slender S-shaped bone connecting the sternum and scapula
  to brace the shoulder.
anatomy:
  bony_landmarks:
  - name: 'Sternal end <a id="sternal-end" class="text-decoration-none text-muted" href="#sternal-end"><small>#</small></a>'
    desc: >
      Medial end that articulates with the sternum.
  - name: 'Acromial end <a id="acromial-end" class="text-decoration-none text-muted" href="#acromial-end"><small>#</small></a>'
    desc: >
      Lateral end that articulates with the {{ linkicon('scapula') }} at the
      acromioclavicular joint.
  - name: 'Shaft <a id="shaft" class="text-decoration-none text-muted" href="#shaft"><small>#</small></a>'
    desc: >
      The middle portion with a gentle S-curve.
  - name: 'Deltoid tubercle <a id="deltoid-tubercle" class="text-decoration-none text-muted" href="#deltoid-tubercle"><small>#</small></a>'
    desc: >
      Rough area on the lateral third for attachment of the
      {{ linkicon('dt') }}.
  insertions:
  - name: Medial clavicle
    muscles:
    - '{{ linktitle("pecmaj") }}'
    - '{{ linktitle("scm") }}'
  - name: Deltoid tubercle
    muscles:
    - '{{ linktitle("dt") }}'
    - '{{ linktitle("trz") }}'
