author: Brian Lee
icon: ':bone:'
id: clavicle
pubdate: Aug 25, 2025
status: Review Pending
title: Clavicle
breadcrumbs:
  - title: Home
    url: /
  - title: Bones
    url: /bones/
  - title: Clavicle
url: /bones/clavicle
description: >
  The clavicle is a slender S-shaped bone connecting the sternum and scapula
  to brace the shoulder.
anatomy:
  bony_landmarks:
  - name: 'Sternal end {{ anchor("sternal-end") }}'
    desc: >
      Medial end that articulates with the sternum.
  - name: 'Acromial end {{ anchor("acromial-end") }}'
    desc: >
      Lateral end that articulates with the {{ linkicon('scapula') }} at the
      acromioclavicular joint.
  - name: 'Shaft {{ anchor("shaft") }}'
    desc: >
      The middle portion with a gentle S-curve.
  - name: 'Deltoid tubercle {{ anchor("deltoid-tubercle") }}'
    desc: >
      Rough area on the lateral third for attachment of the
      {{ linkicon('dt') }}.
  insertions:
  - name: Medial clavicle
    muscles:
    - '{{ linktitle("pecmaj") }}'
    - '{{ linktitle("scm") }}'
  - name: Deltoid tubercle
    muscles:
    - '{{ linktitle("dt") }}'
    - '{{ linktitle("trz") }}'
