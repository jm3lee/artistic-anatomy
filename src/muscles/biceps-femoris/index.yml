anatomy: !!omap
- actions:
  - Flexes the knee
  - Extends the hip (long head)
  - Laterally rotates the leg when the knee is flexed
- insertions:
  - Head of the {{ linkicon("fibula") }}
  - Lateral condyle of the {{ linkicon("tibia") }}
- origins:
  - 'Long head: Ischial tuberosity of the {{ linkicon("pelvis") }}'
  - 'Short head: Linea aspera of the {{ linkicon("femur") }}'
description: >
  Two-headed lateral hamstring whose long head springs from the pelvis while the
  short head arises on the distal femur to reinforce knee flexion and hip
  extension power.
