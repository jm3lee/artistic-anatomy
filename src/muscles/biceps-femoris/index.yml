anatomy: !!omap
- actions:
  - Flexes the knee
  - Extends the hip (long head)
  - Laterally rotates the leg when the knee is flexed
- insertions:
  - 'Long head: Merges into the common hamstring tendon on the head of the
    {{ linkicon("fibula") }} with slips to the lateral condyle of the
    {{ linkicon("tibia") }}'
  - 'Short head: Joins the long head in the shared tendon on the head of the
    {{ linkicon("fibula") }} and fans into the fascia at the lateral condyle of
    the {{ linkicon("tibia") }}'
- origins:
  - 'Long head: Ischial tuberosity of the {{ linkicon("pelvis") }}'
  - 'Short head: Linea aspera of the {{ linkicon("femur") }}'
description: >
  Two-headed lateral hamstring whose long head springs from the pelvis while the
  short head arises on the distal femur to reinforce knee flexion and hip
  extension power.
