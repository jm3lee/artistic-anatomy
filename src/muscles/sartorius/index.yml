anatomy: !!omap
- actions:
  - Flexion of the hip
  - Abduction of the hip
  - Lateral (external) rotation of the hip
  - Flexion of the knee
  - Medial rotation of the tibia on the femur (when knee is flexed)
- insertions:
  - Medial surface of proximal tibia (pes anserinus area)
- origins:
  - Anterior superior iliac spine (ASIS) of the pelvic bone
