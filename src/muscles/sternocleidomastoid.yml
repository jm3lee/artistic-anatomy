name: Sternocleidomastoid
author: Brian Lee
pubdate: Jun 15, 2025
id: scm
icon: ":muscle:"
origins:
  - "Manubrium of sternum"
  - "Medial third of clavicle"
insertions:
  - "Mastoid process of the temporal bone"
actions:
  - "Flexes neck when both sides contract"
  - "Rotates head to opposite side"
  - "Laterally flexes neck to same side"
