anatomy:
  actions:
  - Flexes neck when both sides contract
  - Rotates head to opposite side
  - Laterally flexes neck to same side
  - Assist to elevate the rib cage during inhalation
  insertions:
  - Mastoid process of the temporal bone
  - Superior nuchal line
  origins:
  - Manubrium of sternum
  - Medial third of {{ linkicon("clavicle") }}
author: Brian Lee
icon: ':muscle:'
id: scm
pubdate: Aug 25, 2025
status: Reviewed
title: Sternocleidomastoid
