anatomy: !!omap
- actions:
  - Extends the hip
  - Flexes the knee
  - Medially rotates the leg when the knee is flexed
- insertions:
  - >-
      Proximal medial surface of the {{ linkicon('tibia') }} (pes
      anserinus)
- origins:
  - Ischial tuberosity of the {{ linkicon('pelvis') }}
description: >-
  Cordlike medial hamstring that blends into the pes anserinus after a long,
  narrow tendon.
