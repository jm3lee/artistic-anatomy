- insertions:
  - Iliotibial tract (upper fibers)
  - Gluteal tuberosity (lower fibers)
- origins:
  - Coccyx
  - Edge of sacrum
  - Posterior iliac crest
  - Sacrotuberous and sacroiliac ligaments
