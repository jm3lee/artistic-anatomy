anatomy: !!omap
- actions:
  - Flexes the shoulder (especially the clavicular head)
  - Adducts the shoulder
  - Medially rotates the shoulder
  - Assists in extending the shoulder from a flexed position (sternal head)
- insertions:
  - Crest of the greater tubercle of the humerus (lateral lip of {{ linkicon("bicipital-groove")
    }})
- origins:
  - Medial half of {{ linkicon("clavicle") }}
  - '{{ linktitle("sternum") }}'
  - Costal cartilages of ribs 1-6 (sometimes 1-7)
