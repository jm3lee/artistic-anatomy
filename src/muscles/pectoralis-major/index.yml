anatomy: !!omap
- actions:
  - Flexes the shoulder (especially the clavicular head)
  - Adducts the shoulder
  - Medially rotates the shoulder
  - Assists in extending the shoulder from a flexed position (sternal head)
- insertions:
  - note: Crest greater tubercle humerus (lateral lip )
    site:
      bone: bicipital-groove
- origins:
  - note: Medial half
    site:
      bone: clavicle
  - site:
      bone: sternum
  - note: Costal cartilages ribs 1-6 (sometimes 1-7)
    site: {}
