anatomy:
  actions:
  - Abducts the hip
  - Flexes the hip (anterior fibers)
  - Medially rotates the hip (anterior fibers)
  - Extends the hip (posterior fibers)
  - Laterally rotates the hip (posterior fibers)
  - Keeps the pelvis horizontal in the middle of the walk cycle
  insertions:
  - Lateral aspect of greater trochanter of {{ linkicon("femur") }}
  origins:
  - Gluteal surface of ilium between posterior and anterior gluteal lines
author: Brian Lee
